name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'upload-app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'upload-app/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: upload-app
        run: npm ci

      - name: Install browser for frontend smoke test
        working-directory: upload-app
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: upload-app
        run: npx tsc --noEmit

      - name: Frontend smoke test
        working-directory: upload-app
        run: npm run smoke:frontend

      - name: Worker claims smoke test
        working-directory: upload-app
        run: |
          npm run smoke:worker-claims
          npm run test:xero

      - name: Access verification tests
        working-directory: upload-app
        run: npm run test:access

      - name: AI settings tests
        working-directory: upload-app
        run: |
          npm run test:ai
          npm run smoke:ai-frontend

      - name: Verify HowMuch secret exists
        if: github.event_name == 'push'
        working-directory: upload-app
        run: |
          npx wrangler secret list --format json \
            | jq -e '([.[].name] | index("HOWMUCH_PAT") != null) and (([.[].name] | index("HOWMUCH_PLAN_ID") != null) or ([.[].name] | index("YNAB_BUDGET_ID") != null))'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push'
        working-directory: upload-app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
