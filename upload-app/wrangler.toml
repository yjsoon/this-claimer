name = "receipt-upload"
main = "worker/index.ts"
# Pinned to the "YJ" Cloudflare account so a deploy under another wrangler auth
# profile (e.g. the one bound to ~/Developer/tt-projects) fails instead of
# creating a duplicate worker there.
account_id = "810a0c404daff0737f4a2a97a7aab092"
compatibility_date = "2024-01-01"

# Custom domain
routes = [
  { pattern = "receipts.soon.sg/*", zone_name = "soon.sg" }
]

# R2 bucket binding - create bucket first with: wrangler r2 bucket create receipts
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "receipts"

# KV namespace for Xero OAuth tokens (rotating refresh token + tenant id).
# Created with: npx wrangler kv namespace create XERO_TOKENS
[[kv_namespaces]]
binding = "XERO_TOKENS"
id = "2435b070b98e4ac89312e6d784d66af0"

# Linked Gmail accounts + scan state for the Gmail receipt import. Shares the
# namespace above (keys are prefixed gmail_), so no extra namespace is needed.
[[kv_namespaces]]
binding = "GMAIL_STATE"
id = "2435b070b98e4ac89312e6d784d66af0"

# AI keys and choices saved from the app's Settings > AI section (see
# worker/ai.ts). Same namespace again; the key is ai_settings.
[[kv_namespaces]]
binding = "APP_SETTINGS"
id = "2435b070b98e4ac89312e6d784d66af0"

# Scan linked Gmail accounts for new receipts every four hours. Does nothing
# until GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET are set and an account is linked.
[triggers]
crons = ["17 */4 * * *"]

# Non-secret Xero config. Secrets (XERO_CLIENT_ID, XERO_CLIENT_SECRET) are set
# via `wrangler secret put` (prod) or .dev.vars (local) — never committed.
[vars]
XERO_SCOPES = "openid profile email accounting.transactions accounting.contacts accounting.attachments accounting.settings.read offline_access"
XERO_INPUT_TAXTYPE = "INPUTY24"
# Receipt vision provider tried first for amount extraction + GST detection:
# "minimax" (coding-plan VLM, image receipts), "anthropic" (Claude, images and
# PDFs) or "gemini" (everything, including HEIC). Other providers with keys are
# the fallbacks. Settings > AI in the app overrides this, and keys
# pasted there override the MINIMAX_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY
# secrets.
VISION_PROVIDER = "minimax"
# Gmail receipt import. GMAIL_RECEIPT_QUERY overrides the default Gmail search
# for attachment receipts (see DEFAULT_RECEIPT_QUERY in worker/gmail.ts).
# CF_ACCOUNT_ID is used with the CF_BROWSER_RENDERING_TOKEN secret to print
# body-only ride receipts (Grab, Gojek) to PDF; without the token they are skipped.
GMAIL_INITIAL_LOOKBACK_DAYS = "14"
CF_ACCOUNT_ID = "810a0c404daff0737f4a2a97a7aab092"

# Serve static files from src/
[site]
bucket = "./src"
